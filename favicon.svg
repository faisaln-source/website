<svg width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="m-grad-left" x1="16" y1="36" x2="28" y2="18" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00e5ff"/>
      <stop offset="100%" stop-color="#0088ff"/>
    </linearGradient>
    <linearGradient id="m-grad-right" x1="28" y1="18" x2="48" y2="38" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00a3ff"/>
      <stop offset="100%" stop-color="#0052ff"/>
    </linearGradient>
    <linearGradient id="ring-glow" x1="4" y1="4" x2="60" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00f0ff"/>
      <stop offset="50%" stop-color="#0088ff"/>
      <stop offset="100%" stop-color="#0044ff"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Dark Background Circle -->
  <circle cx="32" cy="32" r="31" fill="#03050c"/>
  
  <!-- Outer Neon Blue Glow Ring -->
  <circle cx="32" cy="32" r="29" stroke="url(#ring-glow)" stroke-width="1.8" filter="url(#glow)" opacity="0.95"/>
  <circle cx="32" cy="32" r="29" stroke="#00e5ff" stroke-width="0.75" opacity="0.7"/>

  <!-- Origami Style "M" Icon matching MakeWise logo -->
  <path d="M16 35.5L26 21L33 30.5L25.5 37.5L16 35.5Z" fill="url(#m-grad-left)"/>
  <path d="M26 21L36 14L48 23V36.5L41 38V28.5L33 30.5L26 21Z" fill="url(#m-grad-right)"/>
</svg>
